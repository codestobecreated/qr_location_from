<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
  <div class="flex items-start gap-3 bg-gradient-to-r from-brand-600 to-electric-600 px-5 py-4 text-white">
    <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-white/15">
      <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="m3.75 13.5 10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75Z"/></svg>
    </div>
    <div class="min-w-0">
      <p class="text-xs font-semibold uppercase tracking-wider text-white/80">You are at</p>
      <h1 class="text-lg font-bold leading-snug">{{ station.name }}</h1>
    </div>
  </div>
  <dl class="grid grid-cols-1 gap-x-4 gap-y-2 px-5 py-4 text-sm sm:grid-cols-2">
    <div><dt class="text-xs text-slate-500">Location</dt><dd class="font-medium text-slate-900">{{ location.name }}</dd></div>
    <div><dt class="text-xs text-slate-500">City &amp; State</dt><dd class="font-medium text-slate-900">{{ station.city }}, {{ station.state }}</dd></div>
    <div class="sm:col-span-2"><dt class="text-xs text-slate-500">Station address</dt><dd class="font-medium text-slate-900">{{ station.address }}</dd></div>
  </dl>
</div>
