{# Usage: {% include "partials/field.html" with field=form.name %} #}
<div class="{% if field.errors %}has-error{% endif %} {{ wrapper_class|default:'' }}">
  {% if field.widget_type == "checkbox" %}
    <label class="flex items-start gap-3 text-sm text-slate-700">
      {{ field }}
      <span>{{ field.label }}{% if field.help_text %}<span class="block text-xs text-slate-500">{{ field.help_text }}</span>{% endif %}</span>
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="label">{{ field.label }}{% if field.field.required %} <span class="text-rose-500">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
  {% endif %}
  {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
</div>
